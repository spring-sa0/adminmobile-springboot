# Integration continue : a chaque push et pull request, lance les tests puis verifie que l'image
# Docker se construit. Aucun acces a la base n'est necessaire (les tests simulent les services).
name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests Maven
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilation et tests
        run: mvn -B verify

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build --tag adminmobile-springboot:ci .

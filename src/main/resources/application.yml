spring:
  application:
    name: adminmobile

  datasource:
    # Correspond a la ressource JNDI java:app/ds_admin (glassfish-resources.xml) de l'appli d'origine.
    # Ne JAMAIS committer d'identifiants ici : tout vient de variables d'environnement.
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB1}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:16}
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
    show-sql: false

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m

app:
  security:
    # Nombre d'echecs de connexion avant blocage - reprend err_code de Users
    max-login-attempts: 5
  reports:
    jasper-source-dir: classpath:reports/

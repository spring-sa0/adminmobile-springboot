spring:
  application:
    name: adminmobile

  # Charge le .env local s'il existe (lancement IDE / mvn). En Docker, les variables viennent de env_file.
  config:
    import: optional:file:${ENV_FILE:.env}[.properties]

  datasource:
    # Correspond a la ressource JNDI java:app/ds_admin (glassfish-resources.xml) de l'appli d'origine.
    # Ne JAMAIS committer d'identifiants ici : tout vient de variables d'environnement.
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB1}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:16}
      connection-timeout: 30000
      # Le profil Oracle du compte technique coupe les sessions inactives depuis 30 min
      # (IDLE_TIME = 30) : on renouvelle chaque connexion avant (25 min) et on garde les
      # connexions inutilisees actives (test toutes les 5 min), pour ne jamais recevoir une
      # connexion deja coupee par Oracle apres une periode calme (nuit, week-end).
      max-lifetime: 1500000
      keepalive-time: 300000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
    show-sql: ${SHOW_SQL:false}

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

  mail:
    # Serveur SMTP. Vide : aucun e-mail ne peut partir (notifications, alertes de supervision).
    host: ${MAIL_HOST:webmail.laposte.tg}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      # Port 587 (soumission) : le serveur exige une connexion chiffree avant l'envoi
      # ("530 Must issue a STARTTLS command first" sinon). MAIL_STARTTLS=false pour un relais sans TLS.
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      # Delais (ms) : un serveur SMTP lent ou injoignable ne doit pas bloquer un ecran ni les alertes.
      mail.smtp.connectiontimeout: 15000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

server:
  port: ${SERVER_PORT:8080}
  # Derriere un reverse proxy HTTPS (Nginx...) : prend en compte X-Forwarded-Proto/For, pour que
  # le cookie de session soit marque Secure et que l'IP reelle serve au blocage des tentatives.
  forward-headers-strategy: native
  # Jamais de trace, de message d'exception ni de SQL dans les pages d'erreur (devtools les
  # active sinon). Les details restent dans les logs serveur.
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  security:
    # Echecs de connexion avant blocage temporaire (voir security.LoginAttemptService).
    # 2 par identifiant : le profil Oracle verrouille le compte au 3e echec (FAILED_LOGIN_ATTEMPTS
    # = 3), souvent pour une journee ; l'application doit bloquer avant Oracle.
    # 50 par adresse IP : les utilisateurs d'un meme site sortent souvent par une seule IP (NAT,
    # proxy) ; trop bas, quelques fautes de frappe cumulees bloqueraient tout le site.
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:2}
    max-login-attempts-per-ip: ${MAX_LOGIN_ATTEMPTS_PER_IP:50}
    login-lock-duration: ${LOGIN_LOCK_DURATION:15m}
  reports:
    jasper-source-dir: classpath:reports/
  recherche:
    # Duree maximale d'une periode de recherche (jours) et lignes par page dans les listes
    periode-max-jours: ${RECHERCHE_PERIODE_MAX_JOURS:92}
    taille-page: ${RECHERCHE_TAILLE_PAGE:100}
  export:
    # Nombre maximal de lignes par export de liste (voir web.ExportFilter). Au-dela, l'utilisateur
    # est invite a reduire la periode. Le PDF est plus bas : 5 000 lignes = environ 120 pages.
    max-lignes-excel: ${EXPORT_MAX_LIGNES_EXCEL:50000}
    max-lignes-pdf: ${EXPORT_MAX_LIGNES_PDF:5000}
  charge:
    # Traitements lourds (recherches sur une periode, exports) executes en meme temps, et attente
    # maximale d'une place avant de repondre "service momentanement indisponible" (web.ChargeFilter).
    # A garder sous la taille du pool Oracle (DB_POOL_SIZE) pour laisser des connexions aux ecrans legers.
    traitements-lourds-simultanes: ${CHARGE_TRAITEMENTS_LOURDS:8}
    attente-secondes: ${CHARGE_ATTENTE_SECONDES:20}
  mail:
    # Expediteur des e-mails (notifications, alertes). Vide : MAIL_USERNAME s'il s'agit d'une
    # adresse, sinon sms.contact@laposte.tg (voir service.MailService).
    expediteur: ${MAIL_FROM:}
  supervision:
    # Adresse de la console, citee dans les e-mails d'alerte (ex. https://adminmobile.laposte.tg/supervision)
    url: ${SUPERVISION_URL:}
    alertes:
      # Destinataires des alertes, separes par des virgules. Vide = alertes seulement dans les journaux.
      destinataires: ${SUPERVISION_ALERTES_EMAILS:}
      # Delai minimal avant de renvoyer la meme alerte
      repetition: ${SUPERVISION_ALERTES_REPETITION:1h}
  logs:
    # Dossier des journaux adminmobile.log et audit.log (voir logback-spring.xml)
    dir: ${LOG_DIR:logs}

# Supervision : seul /actuator/health est expose, sans detail (UP / DOWN). Il verifie la connexion
# a la base et sert au healthcheck Docker. Le serveur mail n'est pas verifie : une panne SMTP ne
# doit pas faire redemarrer l'application.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

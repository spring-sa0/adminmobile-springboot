spring:
  application:
    name: adminmobile

  # Charge le .env local s'il existe (lancement IDE / mvn). En Docker, les variables viennent de env_file.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Correspond a la ressource JNDI java:app/ds_admin (glassfish-resources.xml) de l'appli d'origine.
    # Ne JAMAIS committer d'identifiants ici : tout vient de variables d'environnement.
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB1}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:16}
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
    show-sql: ${SHOW_SQL:false}

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  # Derriere un reverse proxy HTTPS (Nginx...) : prend en compte X-Forwarded-Proto/For, pour que
  # le cookie de session soit marque Secure et que l'IP reelle serve au blocage des tentatives.
  forward-headers-strategy: native
  # Jamais de trace, de message d'exception ni de SQL dans les pages d'erreur (devtools les
  # active sinon). Les details restent dans les logs serveur.
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  security:
    # Echecs de connexion avant blocage temporaire (voir security.LoginAttemptService)
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    max-login-attempts-per-ip: ${MAX_LOGIN_ATTEMPTS_PER_IP:20}
    login-lock-duration: ${LOGIN_LOCK_DURATION:15m}
  reports:
    jasper-source-dir: classpath:reports/
  recherche:
    # Duree maximale d'une periode de recherche (jours) et lignes par page dans les listes
    periode-max-jours: ${RECHERCHE_PERIODE_MAX_JOURS:92}
    taille-page: ${RECHERCHE_TAILLE_PAGE:100}
  logs:
    # Dossier des journaux adminmobile.log et audit.log (voir logback-spring.xml)
    dir: ${LOG_DIR:logs}

# Supervision : seul /actuator/health est expose, sans detail (UP / DOWN). Il verifie la connexion
# a la base et sert au healthcheck Docker. Le serveur mail n'est pas verifie : une panne SMTP ne
# doit pas faire redemarrer l'application.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

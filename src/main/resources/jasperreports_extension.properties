# Polices embarquees pour les rapports JasperReports (voir fonts/fonts.xml).
# Les .jrxml utilisent "Arial" et "Times New Roman", absentes des serveurs Linux / du conteneur
# Docker : sans cette extension, le remplissage echoue avec JRFontNotFoundException.
net.sf.jasperreports.extension.registry.factory.adminmobile.fonts=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.adminmobile=fonts/fonts.xml

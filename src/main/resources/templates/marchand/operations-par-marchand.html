<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Operations par Marchand')}"></head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>

<div class="mainDiv">
    <h2>Liste des Operations par Marchand</h2>
    <!-- Port of listeopparcom.xhtml. Reuses RecuElectroniqueService#recupListopByCompe (the
         same numero-compte + periode query already exposed for consultations) and
         FormatsService#getIntitule for the account-name lookup, matching the legacy screen's
         p:ajax "intitulecompte" behaviour (shown here on submit rather than on blur). -->
    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <form method="get" th:action="@{/marchand/operations-par-marchand}">
        <div class="form-row">
            <label for="date1">Date debut</label>
            <input type="date" id="date1" name="date1" th:value="${date1}" required="required"/>
        </div>
        <div class="form-row">
            <label for="date2">Date fin</label>
            <input type="date" id="date2" name="date2" th:value="${date2}" required="required"/>
        </div>
        <div class="form-row">
            <label for="numerocompte">Numero compte</label>
            <input type="text" id="numerocompte" name="numerocompte" th:value="${numerocompte}"/>
            <span th:if="${intitule}" th:text="${intitule}"></span>
        </div>
        <div class="form-actions">
            <button type="submit">Rechercher</button>
        </div>
    </form>

    <div style="overflow-x:auto" th:if="${results != null}">
        <div th:replace="~{fragments/export :: boutons}"></div>
        <table class="data-table">
            <thead>
            <tr>
                <th>Telephone</th>
                <th>Compte</th>
                <th>Montant</th>
                <th>Date operation</th>
                <th>Libelle operation</th>
                <th>Numero operation</th>
                <th>Origine</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${results}">
                <td th:text="${item.telephone}"></td>
                <td th:text="${item.numeroCompte}"></td>
                <td th:text="${item.montant}"></td>
                <td th:text="${#dates.format(item.dateOperation, 'dd/MM/yyyy HH:mm:ss')}"></td>
                <td th:text="${item.libelleOperation}"></td>
                <td th:text="${item.numeroOperation}"></td>
                <td th:text="${item.origine}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(results)}">
                <td colspan="7">Il n'y a aucune operation a afficher.</td>
            </tr>
            </tbody>
        </table>
        <nav th:replace="~{fragments/pagination :: pager}"></nav>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

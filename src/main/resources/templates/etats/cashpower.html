<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Operations Cash Power')}"></head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>

<div class="mainDiv">
    <h2>Operations Cash Power E-Poste et Marchand</h2>
    <!-- Achats CashPower faits depuis les applications (SPT.CASHPOWER), classes par application puis
         par statut. Les achats au guichet ne sont pas concernes. Voir CashpowerOperationsService. -->
    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <form method="get" th:action="@{/etats/cashpower}">
        <div class="form-row">
            <label for="date1">Date debut</label>
            <input type="date" id="date1" name="date1" th:value="${date1}" required="required"/>
        </div>
        <div class="form-row">
            <label for="date2">Date fin</label>
            <input type="date" id="date2" name="date2" th:value="${date2}" required="required"/>
        </div>
        <div class="form-row">
            <label for="application">Application</label>
            <select id="application" name="application">
                <option value="TOUTES" th:selected="${application == 'TOUTES'}">Toutes</option>
                <option value="EPOSTE" th:selected="${application == 'EPOSTE'}">E-Poste</option>
                <option value="MARCHAND" th:selected="${application == 'MARCHAND'}">Marchand</option>
                <option value="AUTRES" th:selected="${application == 'AUTRES'}">Autres (OmniPost, non renseignee)</option>
            </select>
        </div>
        <div class="form-row">
            <label for="statut">Statut</label>
            <select id="statut" name="statut">
                <option value="TOUS" th:selected="${statut == 'TOUS'}">Tous</option>
                <option value="ABOUTIES" th:selected="${statut == 'ABOUTIES'}">Abouties</option>
                <option value="NON_ABOUTIES" th:selected="${statut == 'NON_ABOUTIES'}">Non abouties (echouees, en attente, initiees)</option>
                <option value="ECHOUEES" th:selected="${statut == 'ECHOUEES'}">Echouees</option>
                <option value="EN_ATTENTE" th:selected="${statut == 'EN_ATTENTE'}">En attente</option>
                <option value="INITIEES" th:selected="${statut == 'INITIEES'}">Initiees</option>
                <option value="REMBOURSEES" th:selected="${statut == 'REMBOURSEES'}">Remboursees (annulees)</option>
                <option value="NON_RENSEIGNE" th:selected="${statut == 'NON_RENSEIGNE'}">Non renseigne (achats anciens)</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit">Rechercher</button>
        </div>
    </form>

    <div style="overflow-x:auto;margin-top:20px" th:if="${recap != null and !#lists.isEmpty(recap)}">
        <h3>Recapitulatif par application et par statut</h3>
        <table class="data-table no-export" style="max-width:640px">
            <thead>
            <tr>
                <th>Application</th>
                <th>Statut</th>
                <th>Nombre</th>
                <th>Montant</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="l : ${recap}">
                <td th:text="${l.application}"></td>
                <td th:text="${l.statut}"></td>
                <td th:text="${l.nombre}"></td>
                <td th:text="${#numbers.formatDecimal(l.montant, 1, 'WHITESPACE', 0, 'COMMA')}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div style="overflow-x:auto;margin-top:20px" th:if="${results != null}">
        <div th:replace="~{fragments/export :: boutons}"></div>
        <table class="data-table">
            <thead>
            <tr>
                <th>Application</th>
                <th>Statut</th>
                <th>Date</th>
                <th>Numero operation</th>
                <th>Client</th>
                <th>Telephone</th>
                <th>Compteur</th>
                <th>Montant</th>
                <th>KWh</th>
                <th>Jeton</th>
                <th>Unite / numero recu</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${results}">
                <td th:text="${item.application}"></td>
                <td th:text="${item.statut}"></td>
                <td th:text="${#dates.format(item.dateAchat, 'dd/MM/yyyy HH:mm:ss')}"></td>
                <td th:text="${item.numeroOperation}"></td>
                <td th:text="${item.client}"></td>
                <td th:text="${item.telephone}"></td>
                <td th:text="${item.compteur}"></td>
                <td th:text="${item.montant}"></td>
                <td th:text="${item.kwh}"></td>
                <td th:text="${item.jeton}"></td>
                <td th:text="${item.recu}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(results)}">
                <td colspan="11">Aucun achat Cash Power sur cette periode.</td>
            </tr>
            </tbody>
        </table>
        <nav th:replace="~{fragments/pagination :: pager}"></nav>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reinitialisation de Password')}"></head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>

<div class="mainDiv">
    <h2>Reinitialisation de Password</h2>
    <!-- Port of modifpassword.xhtml / UserCtrl2#afficheruser()+generpass()+modifierpass(). Admin only (/parametres/**). -->
    <!-- TODO / LIMITATION: this only rewrites USERS_EPOSTE.CODE_SECRET (record-keeping / legacy
         downstream use), exactly like the legacy screen. It does NOT change any real login
         credential - this admin console authenticates against Oracle directly and never reads
         this column (see LegacyDbAuthenticationProvider), and the mobile app's own authentication
         is out of scope for this port. -->
    <div class="alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <form method="get" th:action="@{/parametres/modif-password}">
        <div class="form-row">
            <label for="telephone">Telephone</label>
            <input type="text" id="telephone" name="telephone" th:value="${telephone}" maxlength="8" required="required"/>
        </div>
        <div class="form-actions">
            <button type="submit">Rechercher</button>
        </div>
    </form>

    <form method="get" th:action="@{/parametres/modif-password}">
        <input type="hidden" name="telephone" th:value="${telephone}"/>
        <input type="hidden" name="generate" value="true"/>
        <div class="form-row">
            <label for="npass">Init. Password</label>
            <input type="text" id="npass" name="newpass" th:value="${newpass}" readonly="readonly"/>
            <button type="submit">Generer</button>
        </div>
    </form>

    <form method="post" th:action="@{/parametres/modif-password}" style="margin-top:16px">
        <input type="hidden" name="telephone" th:value="${telephone}"/>
        <input type="hidden" name="newpass" th:value="${newpass}"/>
        <div class="form-row">
            <label for="motif">Motif</label>
            <textarea id="motif" name="motif" rows="4" cols="26"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit">Modifier</button>
        </div>
    </form>

    <div style="overflow-x:auto;margin-top:20px" th:if="${candidates != null}">
        <table class="data-table">
            <thead>
            <tr>
                <th>Nom</th>
                <th>Prenom</th>
                <th>Telephone</th>
                <th>Derniere Connexion</th>
                <th>Mail</th>
                <th>Etat Compte</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${candidates}">
                <td th:text="${item.nom}"></td>
                <td th:text="${item.prenom}"></td>
                <td th:text="${item.telephone}"></td>
                <td th:text="${item.dateconnexion != null ? #dates.format(item.dateconnexion, 'dd/MM/yyyy HH:mm:ss') : ''}"></td>
                <td th:text="${item.mail}"></td>
                <td th:text="${item.errCode}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(candidates)}">
                <td colspan="6">Il n'y a aucun client a afficher.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

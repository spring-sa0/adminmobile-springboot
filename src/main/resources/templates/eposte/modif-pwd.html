<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Password Modifies')}"></head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>

<div class="mainDiv">
    <h2>Liste des Password Modifies</h2>
    <!-- Port of etatmodifpwd.xhtml, against the real MODIF_CODESECRET table. -->
    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <form method="get" th:action="@{/eposte/modif-pwd}">
        <div class="form-row">
            <label for="date1">Date debut</label>
            <input type="date" id="date1" name="date1" th:value="${date1}" required="required"/>
        </div>
        <div class="form-row">
            <label for="date2">Date fin</label>
            <input type="date" id="date2" name="date2" th:value="${date2}" required="required"/>
        </div>
        <div class="form-actions">
            <button type="submit">Rechercher</button>
        </div>
    </form>

    <div style="overflow-x:auto" th:if="${results != null}">
        <table class="data-table">
            <thead>
            <tr>
                <th>Telephone</th>
                <th>Nom</th>
                <th>Prenom</th>
                <th>Origine</th>
                <th>Date et heure</th>
                <th>Utilisateur</th>
                <th>Motif</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${results}">
                <td th:text="${item.telephone}"></td>
                <td th:text="${item.nom}"></td>
                <td th:text="${item.prenom}"></td>
                <td th:text="${item.origine}"></td>
                <td th:text="${item.dateetheure != null ? #dates.format(item.dateetheure, 'dd/MM/yyyy HH:mm:ss') : ''}"></td>
                <td th:text="${item.utilisateur}"></td>
                <td th:text="${item.motif}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(results)}">
                <td colspan="7">Il n'y a aucune modification a afficher.</td>
            </tr>
            </tbody>
        </table>
        <nav th:replace="~{fragments/pagination :: pager}"></nav>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

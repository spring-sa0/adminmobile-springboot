<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Achats de Credit')}"></head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>

<div class="mainDiv">
    <h2>Liste d'Achat de Credit Moov</h2>
    <!-- TODO: port of etatlistecredit.xhtml against an UNVERIFIED schema (EPOSTE.ACHAT_CREDIT) -
         no table of this name appears anywhere in the legacy source tree. See
         EposteFabricatedReportRepository javadoc before relying on this in production. -->
    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <form method="get" th:action="@{/eposte/achats-credit}">
        <div class="form-row">
            <label for="date1">Date debut</label>
            <input type="date" id="date1" name="date1" th:value="${date1}" required="required"/>
        </div>
        <div class="form-row">
            <label for="date2">Date fin</label>
            <input type="date" id="date2" name="date2" th:value="${date2}" required="required"/>
        </div>
        <div class="form-actions">
            <button type="submit">Rechercher</button>
        </div>
    </form>

    <div style="overflow-x:auto" th:if="${results != null}">
        <div th:replace="~{fragments/export :: boutons}"></div>
        <table class="data-table">
            <thead>
            <tr>
                <th>Telephone</th>
                <th>Montant</th>
                <th>Date achat</th>
                <th>Operateur</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${results}">
                <td th:text="${item.telephone}"></td>
                <td th:text="${item.montant}"></td>
                <td th:text="${item.dateAchat != null ? #dates.format(item.dateAchat, 'dd/MM/yyyy HH:mm:ss') : ''}"></td>
                <td th:text="${item.operateur}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(results)}">
                <td colspan="4">Il n'y a aucun achat a afficher.</td>
            </tr>
            </tbody>
        </table>
        <nav th:replace="~{fragments/pagination :: pager}"></nav>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Comptes Eposte Desactives')}"></head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>

<div class="mainDiv">
    <h2>Liste des Comptes Eposte Desactives</h2>
    <!-- Port of etatcomptedesa.xhtml. No date fields on the legacy screen (just a PDF export
         button); ACTIF = 2 is a confirmed marker (usersdao.desactivecompte sets it). -->

    <div style="overflow-x:auto">
        <table class="data-table">
            <thead>
            <tr>
                <th>Telephone</th>
                <th>Nom</th>
                <th>Prenom</th>
                <th>Numero compte</th>
                <th>Date creation</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${results}">
                <td th:text="${item.telephone}"></td>
                <td th:text="${item.nom}"></td>
                <td th:text="${item.prenom}"></td>
                <td th:text="${item.numeroCompte}"></td>
                <td th:text="${item.dateCreation != null ? #dates.format(item.dateCreation, 'dd/MM/yyyy') : ''}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(results)}">
                <td colspan="5">Aucun compte desactive.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

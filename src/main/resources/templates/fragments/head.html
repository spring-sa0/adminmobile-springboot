<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} ?: 'ADMINISTRATION, Application Mobile'">ADMINISTRATION, Application Mobile</title>
    <!-- Feuilles PrimeFaces/JSF d'origine (reset.css, Site.css, TabControl.css, tcal.css,
         dataTable.css, newcss.css) volontairement retirees : aucun template ne s'appuie
         plus sur leurs classes (ui-*, dataTable, tcal...) depuis le passage a Thymeleaf,
         et elles entraient en conflit avec le nouveau design ci-dessous. -->
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a2e2a'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%23f2b705' text-anchor='middle'%3EAM%3C/text%3E%3C/svg%3E"/>

    <!-- Mode clair/sombre : applique le theme AVANT le premier rendu (evite le flash),
         se souvient du choix dans localStorage, sinon suit la preference systeme. -->
    <script th:inline="none">
        (function () {
            function readStored() { try { return localStorage.getItem('am-theme'); } catch (e) { return null; } }
            function apply(theme) { document.documentElement.setAttribute('data-theme', theme); }

            var stored = readStored();
            var initial = stored || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
            apply(initial);

            window.AMTheme = {
                current: function () { return document.documentElement.getAttribute('data-theme') || 'light'; },
                toggle: function () {
                    var next = this.current() === 'dark' ? 'light' : 'dark';
                    apply(next);
                    try { localStorage.setItem('am-theme', next); } catch (e) {}
                }
            };
        })();
    </script>
</head>
</html>
